name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 12 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            "https://guonvkorystzpzypbtmy.supabase.co/rest/v1/")
          echo "HTTP status: $STATUS"
          if [ "$STATUS" = "000" ]; then
            echo "Ping failed - no response"
            exit 1
          else
            echo "Supabase is alive"
          fi
